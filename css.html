<!DOCTYPE html>
<div class="box">
</div>

<style>
body{
  background-color:black
}
.box{
 height:30px;
width:30px;
  box-shadow:0px 0px 8px,0px 0px 8px cyan inset;
  animation:rotate 2s ease-in infinite;
  border-radius:5px;
 margin-top:170px;
  margin-left:130px
}
@keyframes rotate{
 0%{
   transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);
 }
 33%{
   transform:rotateX(180deg) rotateY(0deg) rotateZ(0deg);
 }   
  67%{
   transform:rotateX(0deg) rotateY(180deg) rotateZ(0deg)
  }
  100%{
    transform:rotate(0deg) rotateX(0deg)  rotateZ(180deg)
  }
}
</style>
</html>
