<svg viewBox="0 0 240 240" width="240" height="240" xmlns="http://www.w3.org/2000/svg" aria-label="CSS3 Logo with Transparent Cutout 3">
  <style>
    .css-neon {
      transform-origin: center;
      filter:
        drop-shadow(0 0 6px rgba(97, 232, 255, 0.55))
        drop-shadow(0 0 18px rgba(0, 212, 255, 0.35));
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.35s ease;
      cursor: pointer;
    }

    .css-neon:hover {
      transform: translateY(-4px) scale(1.04);
      filter:
        drop-shadow(0 0 10px rgba(97, 232, 255, 0.9))
        drop-shadow(0 0 28px rgba(0, 212, 255, 0.65));
    }

    .shield-base {
      fill: #61e8ff;
      transition: fill 0.35s ease;
    }

    .css-neon:hover .shield-base {
      fill: #8cf1ff;
    }

    .shield-highlight {
      fill: #a5f3fc;
      opacity: 0.45;
    }
  </style>

  <defs>
    <!-- Mask to create the transparent '3' cutout matching the official CSS3 logo -->
    <mask id="transparent-three-mask">
      <!-- Black background = hidden/transparent -->
      <rect width="240" height="240" fill="#000000" />
      
      <!-- White shield shape -->
      <g transform="translate(56, 56)" fill="#ffffff">
        <path d="M19.2 114.6L9.4 4.8h109.2l-9.8 109.8L63.9 127z" />
      </g>
      
      <!-- Exact official CSS3 '3' cutout shape -->
      <g transform="translate(56, 56)" fill="#000000">
        <path d="M39.5 35.5l3 28H77L75.5 75H56.5v11H74l-1.5 11.5L61 100.5l-11.5-3-1-8.5H37.5l1.5 17l22 6l22-6l3.5-35.5l1.5-21H39.5z" />
      </g>
    </mask>
  </defs>

  <g class="css-neon" mask="url(#transparent-three-mask)">
    <g transform="translate(56, 56)">
      <!-- Outer Shield Base -->
      <path class="shield-base" d="M19.2 114.6L9.4 4.8h109.2l-9.8 109.8L63.9 127z" />
      <!-- Right-Side Highlight -->
      <path class="shield-highlight" d="M64 117.7l36.3-10.1 8.4-93.8H64z" />
    </g>
  </g>
</svg>