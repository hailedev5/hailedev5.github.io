<svg viewBox="0 0 240 240" width="240" height="240" xmlns="http://www.w3.org/2000/svg" aria-label="HTML5 Logo with Transparent Cutout 5">
  <style>
    .html-neon {
      transform-origin: center;
      filter:
        drop-shadow(0 0 6px rgba(97, 232, 255, 0.55))
        drop-shadow(0 0 18px rgba(0, 212, 255, 0.35));
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.35s ease;
      cursor: pointer;
    }

    .html-neon:hover {
      transform: translateY(-4px) scale(1.04);
      filter:
        drop-shadow(0 0 10px rgba(97, 232, 255, 0.9))
        drop-shadow(0 0 28px rgba(0, 212, 255, 0.65));
    }

    .shield-base {
      fill: #61e8ff;
      transition: fill 0.35s ease;
    }

    .html-neon:hover .shield-base {
      fill: #8cf1ff;
    }

    .shield-highlight {
      fill: #a5f3fc;
      opacity: 0.45;
    }
  </style>

  <defs>
    <!-- SVG Mask that creates a true transparent cutout for the '5' -->
    <mask id="transparent-five-mask">
      <!-- Black background = hidden/transparent -->
      <rect width="240" height="240" fill="#000000" />
      
      <!-- White shield shape = visible cyan shield -->
      <g transform="translate(56, 56)" fill="#ffffff">
        <path d="M19.2 114.6L9.4 4.8h109.2l-9.8 109.8L63.9 127z" />
      </g>
      
      <!-- Black '5' shape = cuts out the '5' so it's transparent -->
      <g transform="translate(56, 56)" fill="#000000">
        <path d="M64 53.9H45.8l-1.3-14.1H64V26.1H29.6l.3 3.7 3.4 37.8H64V53.9zm0 35.6l-.1.1-15.3-4.1-1-10.9H33.9l1.9 21.5 28.1 7.8.1-.1V89.5z" />
        <path d="M63.9 53.9v13.7h16.9l-1.6 17.8-15.3 4.1v14.3l28.1-7.8.2-2.3 3.2-36.1.3-3.7H63.9zm0-27.8v13.7h33.2l.3-3.1.6-6.9.3-3.7H63.9z" />
      </g>
    </mask>
  </defs>

  <!-- The HTML5 shield with the transparent cutout mask and neon cyan glow applied -->
  <g class="html-neon" mask="url(#transparent-five-mask)">
    <g transform="translate(56, 56)">
      <!-- Outer Shield Base -->
      <path class="shield-base" d="M19.2 114.6L9.4 4.8h109.2l-9.8 109.8L63.9 127z" />
      <!-- Right-Side Highlight -->
      <path class="shield-highlight" d="M64 117.7l36.3-10.1 8.4-93.8H64z" />
    </g>
  </g>
</svg>